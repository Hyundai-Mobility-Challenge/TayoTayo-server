spring:
  application:
    name: tayotayo-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/tayotayo_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.json
    disable-swagger-default-url: true
